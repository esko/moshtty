<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <title>Crostini Ghostty Terminal</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">Crostini Ghostty</div>
        <div id="status" class="status" data-state="connecting">Connecting</div>
        <button id="diagnosticsToggle" class="toolbar-button" type="button" title="Diagnostics" aria-label="Diagnostics">
          <span aria-hidden="true">i</span>
        </button>
        <button id="reconnect" class="toolbar-button" type="button" title="Reconnect" aria-label="Reconnect">
          <span aria-hidden="true">↻</span>
        </button>
      </header>
      <main id="settings" class="settings-page" hidden aria-label="Settings"></main>
      <main id="terminal" class="terminal-root" aria-label="Terminal"></main>
      <nav id="terminalContextMenu" class="context-menu" hidden aria-label="Terminal context menu">
        <button type="button" data-action="copy">Copy</button>
        <button type="button" data-action="paste">Paste</button>
        <button type="button" data-action="select-all">Select all</button>
        <hr />
        <button type="button" data-action="new-tab">New terminal tab</button>
        <button type="button" data-action="split-right">Split right</button>
        <button type="button" data-action="split-down">Split down</button>
        <button type="button" data-action="detach">Move pane to new tab</button>
        <button type="button" data-action="close-pane">Close pane</button>
        <button type="button" data-action="clear">Clear screen</button>
        <hr />
        <button type="button" data-action="settings">Terminal settings</button>
      </nav>
      <aside id="diagnostics" class="diagnostics" hidden aria-label="Diagnostics">
        <div class="diagnostics-title">Diagnostics</div>
        <dl id="diagnosticsList"></dl>
      </aside>
      <section id="offline" class="offline" hidden>
        <h1>Agent unavailable</h1>
        <p>Start the Crostini agent, then reconnect.</p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
