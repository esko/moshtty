<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <title>Crostini Ghostty Terminal</title>
    <script type="module" crossorigin src="/assets/index-BerrY4sr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DiGsfAx2.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">Crostini Ghostty</div>
        <div id="status" class="status" data-state="connecting">Connecting</div>
        <button id="diagnosticsToggle" class="toolbar-button" type="button" title="Diagnostics" aria-label="Diagnostics">
          <span aria-hidden="true">i</span>
        </button>
        <button id="reconnect" class="toolbar-button" type="button" title="Reconnect" aria-label="Reconnect">
          <span aria-hidden="true">↻</span>
        </button>
      </header>
      <main id="settings" class="settings-page" hidden aria-label="Settings"></main>
      <main id="terminal" class="terminal-root" aria-label="Terminal"></main>
      <nav id="terminalContextMenu" class="context-menu" hidden aria-label="Terminal context menu">
        <button type="button" data-action="copy">Copy</button>
        <button type="button" data-action="paste">Paste</button>
        <button type="button" data-action="select-all">Select all in pane</button>
        <hr />
        <button type="button" data-action="rename">Rename pane</button>
        <button type="button" data-action="duplicate-pane">Duplicate pane</button>
        <button type="button" data-action="copy-pane-id">Copy pane id</button>
        <button type="button" data-action="new-tab">New terminal tab</button>
        <button type="button" data-action="copy-tab-id">Copy tab id</button>
        <button type="button" data-action="split-right">Split pane right</button>
        <button type="button" data-action="split-down">Split pane down</button>
        <button type="button" data-action="restart-pane">Restart pane</button>
        <button type="button" data-action="restart-tab">Restart tab</button>
        <button type="button" data-action="detach">Move pane to new tab</button>
        <button type="button" data-action="close-pane">Close pane</button>
        <button type="button" data-action="close-tab">Close tab</button>
        <button type="button" data-action="clear">Clear screen</button>
        <hr />
        <button type="button" data-action="settings">Terminal settings</button>
      </nav>
      <aside id="diagnostics" class="diagnostics" hidden aria-label="Diagnostics">
        <div class="diagnostics-title">Diagnostics</div>
        <dl id="diagnosticsList"></dl>
      </aside>
      <dialog id="renameDialog" class="rename-dialog" aria-labelledby="renameDialogTitle">
        <form method="dialog">
          <h2 id="renameDialogTitle">Rename</h2>
          <label>
            <span>Name</span>
            <input id="renameInput" name="title" type="text" autocomplete="off" />
          </label>
          <div class="rename-dialog-actions">
            <button class="secondary-button" type="button" id="renameReset">Reset automatic</button>
            <button class="secondary-button" value="cancel">Cancel</button>
            <button class="primary-button" value="save">Save</button>
          </div>
        </form>
      </dialog>
      <dialog id="profileDialog" class="profile-dialog" aria-labelledby="profileDialogTitle">
        <form id="profileForm" method="dialog">
          <h2 id="profileDialogTitle">New profile</h2>
          <label>
            <span>Name</span>
            <input id="profileTitle" name="title" type="text" autocomplete="off" />
          </label>
          <label>
            <span>Shell path</span>
            <input id="profileShell" name="shell" type="text" placeholder="/bin/bash" autocomplete="off" />
          </label>
          <label>
            <span>Working directory</span>
            <input id="profileWorkingDir" name="workingDir" type="text" placeholder="/home/user/project" autocomplete="off" />
          </label>
          <label>
            <span>Environment</span>
            <textarea id="profileEnv" name="env" rows="5" spellcheck="false" placeholder="KEY=value"></textarea>
          </label>
          <div id="profileError" class="dialog-error" hidden></div>
          <div class="dialog-actions">
            <button class="secondary-button" value="cancel">Cancel</button>
            <button class="primary-button" value="save">Save</button>
          </div>
        </form>
      </dialog>
      <dialog id="spaceDialog" class="rename-dialog" aria-labelledby="spaceDialogTitle">
        <form method="dialog">
          <h2 id="spaceDialogTitle">New space</h2>
          <label>
            <span>Name</span>
            <input id="spaceTitle" name="title" type="text" autocomplete="off" />
          </label>
          <div class="dialog-actions">
            <button class="secondary-button" value="cancel">Cancel</button>
            <button class="primary-button" value="save">Create</button>
          </div>
        </form>
      </dialog>
      <section id="offline" class="offline" hidden>
        <h1>Agent unavailable</h1>
        <p>Start the Crostini agent, then reconnect.</p>
      </section>
    </div>
  </body>
</html>
